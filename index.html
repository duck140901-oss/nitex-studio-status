<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>NITEX Studio Status</title><link rel="icon" type="image/png" sizes="128x128" href="/favicon.png"><meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fragment+Mono&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#D7FF00;--k:#000;--g:#808080;--l:#E6E6E6;--w:#fff;--d:#1b1b1b;--line:#c9c9c9;box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--l);color:var(--k);font:15px/1.45 'Inter Tight',Arial,sans-serif}
.h,h1,h2{font-family:'Archivo Black','Arial Black',sans-serif;text-transform:uppercase;letter-spacing:-.01em;font-weight:400}
.m{font-family:'Fragment Mono',ui-monospace,monospace;font-size:12px;color:var(--g)}
#login{position:fixed;inset:0;background:var(--k);color:var(--w);display:grid;place-items:center;z-index:9;overflow:hidden}
#login .lens{position:absolute;right:-8%;top:8%;width:46vw;height:70vh;background:var(--y);transform:skewX(-20deg)}
#login form{position:relative;width:min(380px,88vw);display:grid;gap:12px}
#login h1{font-size:clamp(32px,6vw,42px);line-height:1;margin-bottom:10px}
input,select,button{font:inherit}
input,select{background:var(--d);border:1px solid #333;color:var(--w);padding:12px;width:100%}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.btn{background:var(--y);color:var(--k);border:0;padding:12px 16px;font-family:'Fragment Mono',monospace;text-transform:uppercase;cursor:pointer}
.btn.o{background:none;border:1px solid var(--k)}
#err{color:var(--y);min-height:18px}
#app{display:none;min-height:100vh;grid-template-columns:270px 1fr}
aside{background:var(--k);color:var(--w);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 8px}
.sym{width:52px;height:32px;background:var(--y);transform:skewX(-20deg);display:inline-block;flex:0 0 52px}
.nav{background:none;border:0;color:#bbb;text-align:left;padding:11px 12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.nav.on{background:var(--y);color:var(--k)}
.nav.on .sym{background:var(--k)}.nav .sym{width:12px;height:10px;background:#555}
main{padding:22px 28px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.top h1{font-size:34px;line-height:1}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools select{background:var(--w);color:var(--k);border:1px solid var(--line);width:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.c{background:var(--w);padding:18px;position:relative;min-width:0;border-top:2px solid var(--k)}
.c.k{background:var(--k);color:var(--w);border-color:var(--y)}.c.y{background:var(--y)}
.c h2{font-size:15px;margin-bottom:12px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.big{font-family:'Archivo Black',sans-serif;font-size:44px;line-height:1}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pipe div{padding:10px;background:var(--l)}.pipe b{font-family:'Archivo Black';font-size:22px;display:block}.pipe .on{background:var(--k);color:var(--y)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{font:12px 'Fragment Mono',monospace;color:var(--g);text-align:left;padding:8px;border-bottom:1px solid var(--k);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--l);white-space:nowrap}tr.t td{background:var(--l);font-weight:600}
.bar{height:8px;background:var(--l)}.bar i{display:block;height:100%;background:var(--k)}
.pill{padding:2px 8px;background:var(--y);font:11px 'Fragment Mono',monospace}.pill.g{background:var(--l)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal i{font:10px 'Fragment Mono';color:var(--g);font-style:normal}
.cal b{font-weight:500;font-size:12px;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%}
.cal .sat{background:var(--line);border-color:var(--line)}.cal .hol{background:var(--k);color:var(--y);border-color:var(--k)}.cal .td{background:var(--y);border-color:var(--k)}.cal .no{border:0}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--c)}
a{color:inherit}#toast{position:fixed;bottom:20px;right:20px;background:var(--k);color:var(--y);padding:12px 16px;display:none;z-index:10}
.empty{padding:20px;background:var(--l);color:var(--d)}
.profile{margin-top:auto;padding:12px 8px 6px;border-top:1px solid #333;display:flex;align-items:center;gap:10px;min-width:0}.avatar-btn{width:60px;height:60px;flex:0 0 60px;border:1px solid #555;border-radius:50%;padding:0;overflow:hidden;background:#222;position:relative;cursor:pointer}.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}.avatar-btn span{position:absolute;right:0;bottom:0;background:var(--y);color:#000;width:16px;height:16px;border-radius:50%;font:12px/16px Arial;text-align:center}.profile-meta{min-width:0;display:grid;gap:2px}.profile-meta #who{color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-meta #role{color:#aaa;font-size:11px}.change-photo{color:var(--y);font:10px Fragment Mono,monospace;cursor:pointer;text-transform:uppercase}
.team-panel{padding:12px 10px 14px;border-top:1px solid #333;border-bottom:1px solid #333;min-height:0}
.team-heading{color:var(--y);font:11px Fragment Mono,monospace;letter-spacing:.08em;margin-bottom:12px}
.team-list{display:grid;gap:12px;max-height:320px;overflow-y:auto}
.team-member{display:flex;align-items:center;gap:12px;min-width:0;min-height:50px}
.team-member img{width:50px;height:50px;flex:0 0 50px;object-fit:cover;object-position:center;border-radius:50%;background:#333;border:1px solid #666;display:block;image-rendering:auto}
.team-member-meta{min-width:0;display:grid;gap:3px}
.team-member-name{color:#fff;font-size:14px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-member-role{color:#aaa;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-loading{color:#888;font:10px Fragment Mono,monospace}
@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.logo{margin:0 10px 0 0}.nav{white-space:nowrap}.team-panel{flex:0 0 270px}.profile{flex:0 0 auto;min-width:210px}main{padding:16px}.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.pipe{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login"><div class="lens"></div><form id="lf"><h1 class="login-brand">NITEX<br>Studio Status</h1>
<input id="lu" type="email" placeholder="Work email address" autocomplete="username" required aria-label="Email address"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required><button class="btn">Sign in</button><div id="err" class="m"></div></form></div>
<div id="app"><aside><div class="logo"><span class="sym"></span><span class="h" style="font-size:20px">Nitex</span></div><div id="nav" style="display:contents"></div><section class="team-panel" aria-label="Studio team"><div class="team-heading">STUDIO TEAM / 05</div><div id="teamList" class="team-list"><div class="team-loading">Loading team…</div></div></section><div class="profile" id="profile"><button type="button" id="avatarBtn" class="avatar-btn" title="Change profile photo"><img id="avatar" alt="Profile photo"></button><div class="profile-meta"><div id="who"></div><div id="role"></div><label for="avatarFile" class="change-photo">Change photo</label><input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp" hidden></div></div><button class="nav" id="out" style="padding:8px 8px">Sign out</button></aside>

function kind(d,H){const k=iso(d);if(H[k])return'hol';if(d.getDay()===6&&!D.sat.includes(k))return'sat';return''}

const D8=v=>v instanceof Date?iso(new Date(v.getTime()+12*36e5)):null;
function parse(buf){const wb=XLSX.read(buf,{cellDates:true}),g=s=>XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true,defval:null}),rows=[];
 g('Studio Status').slice(8).forEach(r=>{if(r[2]==null||!r[4])return;rows.push({q:+r[2],s:r[3]||'',i:D8(r[4]),sh:D8(r[5]),c:D8(r[6]),g:D8(r[7]),k:D8(r[8]),u:D8(r[9]),d:+r[10]||0,t:r[11]||'',n:r[13]||''})});
 const hol=[],sat=[];g('Holidays & Weekends').slice(25).forEach(r=>{if(r[0]&&r[1])hol.push({n:r[0],f:D8(r[1]),t:D8(r[2])});if(r[5])sat.push(D8(r[5]))});
 const tour=[];g('360 Virtual Tour').slice(2).forEach(r=>{if(r[2])tour.push({n:r[1],c:String(r[2]).trim(),o:r[3],b:r[4],l:r[5],d:r[6] instanceof Date?D8(r[6]):r[6],s:/live/i.test(r[7]||''),k:r[8]})});
 return{rows,hol,sat,tour,at:new Date().toISOString()}}
let oneDriveSyncTimer=null;
let oneDriveSyncInFlight=false;
let lastOneDriveSyncAt=0;
function stopOneDriveAutoSync(message){
 if(oneDriveSyncTimer){clearInterval(oneDriveSyncTimer);oneDriveSyncTimer=null;}
 if(lastOneDriveSyncAt)toast(message);
}
async function syncOneDrive(manual=false){
 if(oneDriveSyncInFlight)return false;
 oneDriveSyncInFlight=true;
 try{
  let sessionResult=await sb.auth.getSession();
  let session=sessionResult.data?.session;
  if(!session){toast('Please sign in to the dashboard first.');return false}
  // Refresh an expired or near-expiry Supabase access token before calling protected APIs.
  if(!session.expires_at || session.expires_at*1000 < Date.now()+120000){
   const refreshed=await sb.auth.refreshSession();
   if(refreshed.error || !refreshed.data?.session){
    toast('Dashboard session could not be refreshed. Please sign out and sign in again.');
    return false;
   }
   session=refreshed.data.session;
  }
  const accessToken=session.access_token;
  const headers={authorization:'Bearer '+accessToken};
  const statusResponse=await fetch('/api/auth/status',{headers,cache:'no-store'});
  const status=await statusResponse.json();
  if(!statusResponse.ok||!status.authenticated){
   if(manual){toast('Dashboard authentication expired. Please sign in again.');return false}
   return false;
  }
  if(!status.connected){
   if(manual && (me.email||'').toLowerCase()==='alamin@nitex.com'){
    const loginResponse=await fetch('/api/auth/login',{headers,cache:'no-store'});
    const loginData=await loginResponse.json();
    if(!loginResponse.ok)throw new Error(loginData.error||'Could not connect OneDrive.');
    location.href=loginData.authorizationUrl;
    return false;
   }
   if(manual)toast('Shared OneDrive is not connected yet. Alamin must connect it first.');
   return false;
  }
  const response=await fetch('/api/excel'+(manual?'?manual=1':''),{headers,cache:'no-store'});
  if(response.status===401){
   if(manual)toast('Dashboard authentication expired. Please sign in again.');
   else stopOneDriveAutoSync('Shared OneDrive connection expired. Alamin must reconnect it.');
   return false;
  }
  if(response.status===409){
   const error=await response.json().catch(()=>({}));
   if(manual)toast(error.error||'Shared OneDrive is not connected yet.');
   return false;
  }
  if(!response.ok){
   const error=await response.json().catch(()=>({}));
   throw new Error(error.error||'Could not download the OneDrive workbook.');
  }
  const data=parse(await response.arrayBuffer());
  if(!data.rows.length)throw new Error('The workbook was downloaded, but no Studio Status rows were found.');
  D=data;prep();go();
  lastOneDriveSyncAt=Date.now();
  if(manual)toast('Studio Status updated from OneDrive.');
  if(!oneDriveSyncTimer)oneDriveSyncTimer=setInterval(()=>syncOneDrive(false),300000);
  return true;
 }catch(error){
  toast(error.message||'OneDrive sync failed. Please try again.');
  return false;
 }finally{
  oneDriveSyncInFlight=false;
 }
}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible' && lastOneDriveSyncAt && Date.now()-lastOneDriveSyncAt>=300000){
  syncOneDrive(false);
 }
});
$('#up').onclick=()=>syncOneDrive(true);
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=parse(await f.arrayBuffer());if(!d.rows.length)throw 0;D=d;prep();go();toast('Excel preview loaded in this browser.')}catch(x){toast('Could not read that file. Use the Studio Status tracker .xlsx')}e.target.value=''};
